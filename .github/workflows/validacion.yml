name: Validación FBM
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar conectividad FBM (sin credenciales ni registro)
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, ssl, http.client
          host = "appaficionfbm.gesdeportiva.es"
          try:
              addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              print("DNS_OK:", bool(addresses))
              conn = http.client.HTTPSConnection(host, timeout=8, context=ssl.create_default_context())
              conn.request("HEAD", "/dispositivo.ashx", headers={"User-Agent": "FBMCard-DEV-connectivity/0.1"})
              resp = conn.getresponse()
              print("HTTPS_HEAD_STATUS:", resp.status)
              print("CONTENT_TYPE:", resp.getheader("Content-Type", "unknown"))
              resp.read()
              conn.close()
          except Exception as exc:
              print("CONNECTIVITY_ERROR_TYPE:", type(exc).__name__)
              print("CONNECTIVITY_ERROR:", str(exc)[:200])
          PY
      - name: Consulta de búsqueda FBM con identidad vacía (diagnóstico no bloqueante)
        shell: bash
        run: |
          set +e
          timeout 25s python3 scripts/diagnostico_fbm.py
          status=$?
          echo "DIAGNOSTICO_FBM_EXIT_CODE=$status"
          echo "Este resultado NO valida una sesión invitada autenticada."
          exit 0
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check fbm-card.js
          node --check custom_components/fbm/www/fbm-card.js
      - name: Ejecutar pruebas
        run: node --test tests/*.test.cjs
      - name: Comprobar empaquetado sincronizado
        run: cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Validar manifiesto HACS
        run: node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("hacs.json","utf8"));const m=JSON.parse(fs.readFileSync("custom_components/fbm/manifest.json","utf8"));if(!h.name||m.domain!=="fbm"||!m.config_flow)process.exit(1)'
      - name: Comprobar sintaxis del diagnóstico oficial FBM
        run: python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("scripts/diagnostico_fbm.py").read_text(encoding="utf-8"))'
      - name: Validar sintaxis de integración Python
        run: python3 -c 'import ast, pathlib; files=list(pathlib.Path("custom_components/fbm").rglob("*.py")); assert files; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in files]'
      - name: Diagnóstico de registro en modo seguro sin red
        run: python3 scripts/probar_registro_invitado.py --android-release 16
      - name: Probar registro Lovelace con simulaciones aisladas
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Empaquetar integración FBM de prueba (sin publicar)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("custom_components/fbm")
          required = (source / "manifest.json", source / "__init__.py",
                      source / "www/fbm-card.js")
          assert all(item.is_file() for item in required), "Paquete FBM incompleto"
          out = Path("dist/fbm-card-install.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, "w", ZIP_DEFLATED) as archive:
              for item in sorted(source.rglob("*")):
                  if item.is_file() and "__pycache__" not in item.parts:
                      archive.write(item, item.as_posix())
          with ZipFile(out) as archive:
              names = set(archive.namelist())
              assert all(item.as_posix() in names for item in required)
              assert not any(name.startswith("/") or ".." in Path(name).parts
                             for name in names), "Ruta insegura en paquete"
          print(f"Paquete FBM listo: {out} (sin secretos ni datos locales)")
          PY
      - name: Guardar paquete FBM para instalación aislada
        uses: actions/upload-artifact@v4
        with:
          name: fbm-card-${{ github.sha }}
          path: dist/fbm-card-install.zip
          retention-days: 7
          if-no-files-found: error
