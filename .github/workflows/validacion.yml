name: Validación DEV
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: node --check fbm-card.js
      - name: Ejecutar pruebas
        run: node --test tests/*.test.cjs
      - name: Validar manifiesto HACS
        run: node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("hacs.json","utf8"));const m=JSON.parse(fs.readFileSync("custom_components/fbm/manifest.json","utf8"));if(!h.name||m.domain!=="fbm"||!m.config_flow)process.exit(1)'
      - name: Comprobar sintaxis del diagnóstico oficial FBM
        run: python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("scripts/diagnostico_fbm.py").read_text(encoding="utf-8"))'
      - name: Validar sintaxis de integración Python
        run: python3 -c 'import ast, pathlib; files=list(pathlib.Path("custom_components/fbm").rglob("*.py")); assert files; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in files]'
      - name: Probar registro Lovelace con simulaciones aisladas
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
