name: Publish FBM Card 0.2.4 stable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and all brand assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("custom_components/fbm/manifest.json").read_text())["version"] == "0.2.4"
          for name in ("icon.png", "logo.png", "icon@2x.png", "logo@2x.png"):
              p=Path("custom_components/fbm/brand")/name
              assert p.read_bytes().startswith(b"\x89PNG\r\n\x1a\n"), name
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Regression tests
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.4 >/dev/null 2>&1; then exit 0; fi
          gh release create v0.2.4 --target "$GITHUB_SHA" --title "FBM Card 0.2.4" --notes-file RELEASE_0.2.4_NOTES.md --latest
