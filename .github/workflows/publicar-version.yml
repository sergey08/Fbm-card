name: Publicar versión FBM
on:
  workflow_run:
    workflows: ["Validación FBM"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar commit validado y rama principal
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$VALIDATED_SHA" != "$main_sha" ]]; then
            echo "Hay un commit posterior en main; se omite una publicación obsoleta."
            echo "RELEASE_CURRENT=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_CURRENT=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.RELEASE_CURRENT == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Extraer versión exacta del manifiesto
        if: env.RELEASE_CURRENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("custom_components/fbm/manifest.json", encoding="utf-8"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "Versión inválida: $version" >&2; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Comprobar documentación de la versión estable
        if: env.RELEASE_CURRENT == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          version = json.loads(pathlib.Path("custom_components/fbm/manifest.json").read_text(encoding="utf-8"))["version"]
          if re.fullmatch(r"\d+\.\d+\.\d+", version):
              readme = pathlib.Path("README.md").read_text(encoding="utf-8")
              expected = f"**Versión estable:** v{version}."
              notes = pathlib.Path(f"RELEASE_{version}_NOTES.md")
              assert expected in readme, f"README no anuncia la versión {version}"
              assert notes.is_file(), f"Faltan las notas {notes}"
              assert f"[Novedades de v{version}]({notes.name})" in readme, "README no enlaza las notas actuales"
              text = notes.read_text(encoding="utf-8")
              assert "## English" in text and "## Español" in text, "Notas no bilingües"
              print(f"Documentación comprobada para v{version}")
          PY

      - name: Publicar release con versión legible para HACS
        if: env.RELEASE_CURRENT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # HACS muestra hashes si solo encuentra pre-releases y la opción beta no está activada.
            # Mantener el sufijo bN en el tag, pero hacer visible esta release al canal normal.
            gh release edit "$TAG" --prerelease=false --latest
            echo "Release existente $TAG marcada como disponible para HACS."
          else
            gh release create "$TAG" --target "$VALIDATED_SHA" --title "FBM Card $VERSION" --generate-notes --latest
            echo "Publicada release $TAG en $VALIDATED_SHA"
          fi
          # Once a stable release exists, its previous bN candidates must no
          # longer be advertised as stable by the GitHub Releases API/HACS.
          # The test beta is preserved for rollback, only its release flag changes.
          if [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            version_regex="${TAG//./[.]}";
            while IFS= read -r beta_tag; do
              [[ -n "$beta_tag" ]] || continue
              gh release edit "$beta_tag" --prerelease
              echo "Marked superseded beta $beta_tag as prerelease."
            done < <(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' |
                     grep -E "^${version_regex}b[0-9]+$" || true)
          fi
          # The old b9 release previously appeared ahead of newer releases in
          # the API list. Check BOTH the /latest pointer and the first listed
          # public release, since HACS uses the first non-prerelease in that list.
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          first="$(gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')"
          echo "GitHub latest=$latest; HACS first public=$first; expected=$TAG"
          if [[ "$latest" != "$TAG" || "$first" != "$TAG" ]]; then
            echo "GitHub release ordering still differs from expected HACS update." >&2
            exit 1
          fi
