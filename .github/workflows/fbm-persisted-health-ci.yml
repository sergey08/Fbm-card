name: FBM persisted sync health validation

on:
  push:
    branches: [fix/auto-sync-persistent-health]
    paths:
      - 'custom_components/fbm/**'
      - 'tests/**'
      - '.github/workflows/fbm-persisted-health-ci.yml'
  pull_request:
    branches:
      - main
      - 'beta/**'
    paths:
      - 'custom_components/fbm/**'
      - 'tests/**'
      - '.github/workflows/fbm-persisted-health-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test Python
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test JavaScript
        run: |
          node --check fbm-card.js
          node --test tests/*.test.cjs
  real-home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant Core 2026.11
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Smoke against HA Core
        run: python tests/ha_real_api_smoke.py
