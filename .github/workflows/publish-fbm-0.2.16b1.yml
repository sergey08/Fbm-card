name: FBM 0.2.16b1
on:
  push:
    branches: [release/fbm-0.2.16b1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.cjs
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.16b1 --target "$GITHUB_SHA" --prerelease --latest=false --title "FBM Card 0.2.16b1" --notes-file RELEASE_0.2.16b1_NOTES.md
