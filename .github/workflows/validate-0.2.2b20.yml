name: Validate FBM 0.2.2b20 candidate

on:
  push:
    branches: [beta/0.2.2b20]
    paths:
      - 'custom_components/fbm/**'
      - 'tests/**'
      - 'fbm-card.js'
      - 'BETA_0.2.2b20_NOTES.md'
      - '.github/workflows/validate-0.2.2b20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert manifest, bundle and release notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert manifest["version"] == "0.2.2b20"
          assert manifest["domain"] == "fbm"
          notes = Path("BETA_0.2.2b20_NOTES.md").read_text()
          assert "## English" in notes and "## Español" in notes
          source = Path("custom_components/fbm/websocket.py").read_text()
          assert '"type": "fbm/competition/match_preview"' in source
          assert "ws_competition_match_preview" in source
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
          grep -Fq 'customElements.define("fbm-competition-card", FBMCompetitionCard)' fbm-card.js
          grep -Fq 'customElements.define("fbm-card", FBMCard)' fbm-card.js
      - name: Execute all Python tests
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check and execute JavaScript tests
        run: |
          node --check fbm-card.js
          node --test tests/*.test.cjs
  home-assistant-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install actual HA Core 2026.11.0
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Test actual Home Assistant API and temporary archive
        run: python tests/ha_real_api_smoke.py
