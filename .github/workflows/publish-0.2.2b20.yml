name: Publish isolated FBM 0.2.2b20 prerelease

on:
  push:
    branches:
      - beta/0.2.2b20
    paths:
      - '.github/workflows/publish-0.2.2b20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    if: github.ref == 'refs/heads/beta/0.2.2b20'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify beta manifest, notes, bundle, and admin-only WebSocket handler
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert manifest["domain"] == "fbm"
          assert manifest["version"] == "0.2.2b20"
          notes = Path("BETA_0.2.2b20_NOTES.md").read_text()
          assert "## English" in notes and "## Español" in notes
          tree = ast.parse(Path("custom_components/fbm/websocket.py").read_text())
          f = next(n for n in tree.body if isinstance(n, ast.AsyncFunctionDef)
                   and n.name == "ws_competition_match_preview")
          decorators = [ast.unparse(d) for d in f.decorator_list]
          assert "websocket_api.require_admin" in decorators
          assert "websocket_api.async_response" in decorators
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
          grep -Fq 'customElements.define("fbm-competition-card", FBMCompetitionCard)' fbm-card.js
          grep -Fq 'customElements.define("fbm-card", FBMCard)' fbm-card.js
      - name: Execute complete Python and JavaScript regression suites
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py'
          node --check fbm-card.js
          node --test tests/*.test.cjs
      - name: Install real Home Assistant Core 2026.11
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Exercise actual HA Core OptionsFlow and temporary SQLite
        run: python tests/ha_real_api_smoke.py
      - name: Publish prerelease after successful validations only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2b20 >/dev/null 2>&1; then
            echo "Release v0.2.2b20 already exists; refusing overwrite"
            exit 1
          fi
          gh release create v0.2.2b20 \
            --target "$GITHUB_SHA" \
            --title "FBM Card 0.2.2b20 (Beta)" \
            --prerelease \
            --notes-file BETA_0.2.2b20_NOTES.md
