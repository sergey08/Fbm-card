name: Publish FBM Card 0.2.6 stable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert m["version"]=="0.2.6"
          assert m["name"]=="FBM Card (no oficial)"
          assert "**Versión estable:** v0.2.6" in Path("README.md").read_text()
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Regression tests
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.6 >/dev/null 2>&1; then exit 0; fi
          gh release create v0.2.6 --target "$GITHUB_SHA" --title "FBM Card 0.2.6 — Partidos automáticos" --notes-file RELEASE_0.2.6_NOTES.md --latest
