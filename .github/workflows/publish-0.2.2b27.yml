name: FBM b27 complete differential archive validation and prerelease

on:
  push:
    branches: [beta/0.2.2b27]
    paths:
      - '.github/workflows/publish-0.2.2b27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version and differential sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert manifest["domain"] == "fbm" and manifest["version"] == "0.2.2b27"
          notes=Path("BETA_0.2.2b27_NOTES.md").read_text()
          assert "## English" in notes and "## Español" in notes
          scheduler=Path("custom_components/fbm/competition_auto_sync.py").read_text()
          player=Path("custom_components/fbm/competition_player_stats.py").read_text()
          assert "PLAYER_FULL_RECHECK_INTERVAL" in scheduler
          assert "ROSTER_FULL_RECHECK_INTERVAL" in scheduler
          assert "force_recheck" in player
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Run Python and JavaScript regression
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs

  real-home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant Core
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Test integration against real Home Assistant
        run: python tests/ha_real_api_smoke.py

  publish:
    needs: [regression, real-home-assistant]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/beta/0.2.2b27'
    steps:
      - uses: actions/checkout@v4
      - name: Publish only if full validation passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2b27 >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create v0.2.2b27 \
            --target "$GITHUB_SHA" \
            --title "FBM Card 0.2.2b27 (Beta)" \
            --prerelease \
            --notes-file BETA_0.2.2b27_NOTES.md
