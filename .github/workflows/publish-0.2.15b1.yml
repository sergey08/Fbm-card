name: Publish FBM Card 0.2.15b1 beta
on:
  push:
    branches: [release/fbm-0.2.15b1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate beta version and package
        run: |
          python -c 'import json; assert json.load(open("custom_components/fbm/manifest.json"))["version"] == "0.2.15b1"'
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Run regression tests
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs
      - name: Check Home Assistant Core compatibility
        run: |
          python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
          python tests/ha_real_api_smoke.py
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.2.14
          path: stable-baseline
          persist-credentials: false
      - name: Check isolated startup, restart and upgrade
        run: python tests/ha_lifecycle_smoke.py stable-baseline/custom_components/fbm
  publish:
    needs: validate
    if: github.ref == 'refs/heads/release/fbm-0.2.15b1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.15b1 >/dev/null 2>&1; then exit 0; fi
          gh release create v0.2.15b1 --target "$GITHUB_SHA" --title "FBM Card 0.2.15b1 - Descarga inicial continua" --notes-file RELEASE_0.2.15b1_NOTES.md --prerelease --latest=false
