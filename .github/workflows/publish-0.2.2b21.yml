name: Publish FBM 0.2.2b21 prerelease

on:
  push:
    branches:
      - beta/0.2.2b21
    paths:
      - '.github/workflows/publish-0.2.2b21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    if: github.ref == 'refs/heads/beta/0.2.2b21'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version, notes, scheduler and unchanged cards
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert manifest["domain"]=="fbm" and manifest["version"]=="0.2.2b21"
          notes=Path("BETA_0.2.2b21_NOTES.md").read_text()
          assert "## English" in notes and "## Español" in notes
          path=Path("custom_components/fbm/competition_auto_sync.py")
          tree=ast.parse(path.read_text())
          scheduler=next(x for x in tree.body if isinstance(x,ast.ClassDef) and x.name=="CompetitionAutoUpdater")
          assert {"_mark","_save_state","async_start"}.issubset({x.name for x in scheduler.body if isinstance(x,(ast.FunctionDef,ast.AsyncFunctionDef))})
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
          grep -Fq 'customElements.define("fbm-competition-card", FBMCompetitionCard)' fbm-card.js
          grep -Fq 'customElements.define("fbm-card", FBMCard)' fbm-card.js
      - name: Run complete Python and JavaScript test suites
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py'
          node --check fbm-card.js
          node --test tests/*.test.cjs
      - name: Install real Home Assistant Core 2026.11
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Exercise Home Assistant API smoke tests
        run: python tests/ha_real_api_smoke.py
      - name: Publish prerelease after all validations succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2b21 >/dev/null 2>&1; then
            echo "Release already exists: refusing overwrite"
            exit 1
          fi
          gh release create v0.2.2b21 \
            --target "$GITHUB_SHA" \
            --title "FBM Card 0.2.2b21 (Beta)" \
            --prerelease \
            --notes-file BETA_0.2.2b21_NOTES.md
