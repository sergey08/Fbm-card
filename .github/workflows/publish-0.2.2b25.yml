name: FBM b25 match-audit validation and prerelease

on:
  push:
    branches: [beta/0.2.2b25]
    paths:
      - '.github/workflows/publish-0.2.2b25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check beta metadata and code
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          info = json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert info["domain"] == "fbm" and info["version"] == "0.2.2b25"
          notes = Path("BETA_0.2.2b25_NOTES.md").read_text()
          assert "## English" in notes and "## Español" in notes
          source = Path("custom_components/fbm/competition_analysis.py").read_text()
          assert "incidencias_anotacion_partidos" in source
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Complete Python and JS tests
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs

  home-assistant-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant Core 2026.11
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Real HA Core smoke test
        run: python tests/ha_real_api_smoke.py

  publish:
    needs: [regression, home-assistant-core]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/beta/0.2.2b25'
    steps:
      - uses: actions/checkout@v4
      - name: Publish gated beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2b25 >/dev/null 2>&1; then
            echo "Release already published. Refusing overwrite"
            exit 1
          fi
          gh release create v0.2.2b25 \
            --target "$GITHUB_SHA" \
            --title "FBM Card 0.2.2b25 (Beta)" \
            --prerelease \
            --notes-file BETA_0.2.2b25_NOTES.md
