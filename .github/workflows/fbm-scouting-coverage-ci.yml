name: Validate FBM scouting coverage

on:
  push:
    branches: [fix/fbm-scouting-coverage]
  pull_request:
    branches: [main, 'beta/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python and JavaScript
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs
  home-assistant-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install real Home Assistant Core
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Smoke test actual Home Assistant API
        run: python tests/ha_real_api_smoke.py
