name: FBM b23 integrated validation and prerelease

on:
  push:
    branches: [beta/0.2.2b23]
    paths:
      - '.github/workflows/publish-0.2.2b23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate beta metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest = json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert manifest["version"] == "0.2.2b23"
          assert manifest["domain"] == "fbm"
          content = Path("BETA_0.2.2b23_NOTES.md").read_text()
          assert "## English" in content and "## Español" in content
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Run complete Python and JavaScript regression
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs

  home-assistant-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install actual Home Assistant Core 2026.11
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Test HA Core API
        run: python tests/ha_real_api_smoke.py

  publish:
    needs: [regression, home-assistant-core]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/beta/0.2.2b23'
    steps:
      - uses: actions/checkout@v4
      - name: Publish beta only when validation succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2b23 >/dev/null 2>&1; then
            echo "Already published; refusing overwrite"
            exit 1
          fi
          gh release create v0.2.2b23 \
            --target "$GITHUB_SHA" \
            --title "FBM Card 0.2.2b23 (Beta)" \
            --prerelease \
            --notes-file BETA_0.2.2b23_NOTES.md
