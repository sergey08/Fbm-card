name: FBM 0.2.17b8
on:
  push:
    branches: [release/fbm-0.2.17b8]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - run: cmp fbm-card.js custom_components/fbm/www/fbm-card.js
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.17b8 --target "$GITHUB_SHA" --prerelease --latest=false --title "FBM Card 0.2.17b8" --notes-file RELEASE_0.2.17b8_NOTES.md
