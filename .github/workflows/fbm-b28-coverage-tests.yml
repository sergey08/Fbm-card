name: FBM b28 coverage regression
on:
  push:
    branches:
      - feat/b28-coverage-diagnostics
  pull_request:
    branches:
      - beta/0.2.2b27
  workflow_dispatch:
jobs:
  player-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Python syntax
        run: |
          python -m py_compile custom_components/fbm/competition_auto_sync.py custom_components/fbm/competition_player_stats.py tests/test_competition_auto_sync.py tests/test_competition_player_stats.py custom_components/fbm/competition_coverage.py tests/test_competition_coverage.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full Python and JavaScript regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
          node --check fbm-card.js
          node --test tests/*.test.cjs
      - name: Test integration against real Home Assistant
        run: |
          python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
          python tests/ha_real_api_smoke.py
