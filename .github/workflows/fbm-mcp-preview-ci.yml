name: FBM MCP archive preview validation

on:
  push:
    branches:
      - feat/mcp-archive-access
    paths:
      - 'custom_components/fbm/**'
      - 'tests/**'
      - '.github/workflows/fbm-mcp-preview-ci.yml'
  pull_request:
    branches:
      - main
      - 'beta/**'
    paths:
      - 'custom_components/fbm/**'
      - 'tests/**'
      - '.github/workflows/fbm-mcp-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-preview-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Python syntax
        run: python -m compileall -q custom_components/fbm tests
      - name: Execute isolated archive tests
        run: python -m unittest discover -s tests -p 'test_competition_match_preview.py' -v
      - name: Execute WebSocket authorization and registration tests
        run: python -m unittest discover -s tests -p 'test_integration.py' -v
  real-home-assistant-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant Core 2026.11.0
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Execute existing HA Core API smoke
        run: python tests/ha_real_api_smoke.py
