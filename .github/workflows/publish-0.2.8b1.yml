name: Publish FBM Card 0.2.8b1 beta
on:
  push:
    branches: [fix/automatic-match-results-v028]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("custom_components/fbm/manifest.json").read_text())
          assert m["version"]=="0.2.8b1"
          assert m["name"]=="FBM Card (no oficial)"
          PY
          cmp fbm-card.js custom_components/fbm/www/fbm-card.js
      - name: Regression tests
        run: |
          python -m compileall -q custom_components/fbm tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check fbm-card.js
          node --test tests/*.test.cjs
      - name: Validate Home Assistant Core compatibility
        run: |
          python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
          python tests/ha_real_api_smoke.py
  publish:
    needs: validate
    if: github.ref == 'refs/heads/fix/automatic-match-results-v028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.8b1 >/dev/null 2>&1; then exit 0; fi
          gh release create v0.2.8b1 --target "$GITHUB_SHA" --title "FBM Card 0.2.8b1 — Refresco de resultados" --notes-file RELEASE_0.2.8b1_NOTES.md --prerelease --latest=false
